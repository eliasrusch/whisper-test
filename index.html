<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whisper Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efece4; --card:#f7f5ef; --ink:#23262b; --mute:#6b6f76; --rule:#d4d0c4;
  --teal:#0f766e; --violet:#6d28d9; --warn:#a1301f;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#17191c; --card:#1e2125; --ink:#e7e5de; --mute:#8d9198; --rule:#33373d;
  --teal:#4fd1c0; --violet:#b69cff; --warn:#ff8f7d; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
  padding-block:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));min-height:100dvh}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-family:var(--mono);font-size:.75rem;color:var(--mute);margin:4px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0;
  font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
select{font:inherit;font-family:var(--sans);font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:10px;min-height:44px;width:100%}
textarea{font:inherit;font-family:var(--mono);font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:10px;width:100%;resize:vertical;min-height:56px}
textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.hint{margin:-6px 0 0;font-family:var(--mono);font-size:.7rem;line-height:1.5;color:var(--mute)}
button{font:inherit;font-family:var(--sans);font-size:1rem;font-weight:500;cursor:pointer;min-height:48px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;padding:0 16px}
button:focus-visible,select:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#go{width:100%;background:var(--teal);border-color:var(--teal);color:var(--paper);min-height:56px;font-size:1.05rem}
#go.live{background:var(--violet);border-color:var(--violet)}
.status{font-family:var(--mono);font-size:.78rem;color:var(--mute);display:flex;gap:10px;align-items:center;min-height:1.4em}
.status b{color:var(--ink);font-weight:500}
.bar{height:3px;background:var(--rule);width:100%}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.level{height:6px;background:var(--rule)}
.level i{display:block;height:100%;width:0;background:var(--violet)}
.card{background:var(--card);border:1px solid var(--rule);padding:16px;min-height:220px;
  font-size:1.12rem;line-height:1.55;overflow-wrap:anywhere}
.card .done{color:var(--teal)}
.card .live{color:var(--violet)}
.card .ph{color:var(--mute);font-family:var(--mono);font-size:.85rem}
.tools{display:flex;gap:10px}
.tools button{flex:1;min-height:44px;font-size:.9rem;border-color:var(--rule);color:var(--mute)}
.legend{font-family:var(--mono);font-size:.7rem;color:var(--mute);display:flex;gap:14px}
.legend .t{color:var(--teal)} .legend .v{color:var(--violet)}
.err{color:var(--warn);font-family:var(--mono);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Whisper Live</h1>
    <p class="sub">Läuft komplett lokal auf dem Gerät</p>
  </header>

  <div class="row">
    <label>Modell
      <select id="model">
        <option value="small" selected>Small, empfohlen (~400–600 MB)</option>
        <option value="turbo">Large-v3-Turbo, experimentell (~760 MB, nur GPU)</option>
        <option value="base">Base (~100 MB)</option>
        <option value="tiny">Tiny, schnellster (~40 MB)</option>
      </select>
    </label>
    <label>Sprache
      <select id="lang">
        <option value="german">Deutsch</option>
        <option value="english">English</option>
        <option value="french">Français</option>
        <option value="italian">Italiano</option>
        <option value="">Automatisch</option>
      </select>
    </label>
  </div>

  <label>Fachbegriffe (kommagetrennt)
    <textarea id="terms" rows="2" spellcheck="false" placeholder="cAMP, GPCR, Adenylylcyclase, G-Protein"></textarea>
  </label>
  <p class="hint">Whisper kann keinen Kontext vorgeben. Stattdessen wird jedes Wort der Ausgabe, das ähnlich klingt wie ein Begriff hier, auf diese Schreibweise korrigiert.</p>

  <button id="go" disabled>Modell laden</button>
  <div class="bar" id="bar" hidden><i id="barfill"></i></div>
  <div class="status"><span id="status">Bereit</span></div>
  <div class="level" aria-hidden="true"><i id="lvl"></i></div>

  <div class="card" id="out" aria-live="polite"><span class="ph">Der Text erscheint hier, während du sprichst.</span></div>
  <div class="legend"><span class="t">■ fertig</span><span class="v">■ vorläufig</span></div>
  <div class="tools"><button id="copy">Kopieren</button><button id="clear">Leeren</button></div>
  <div class="err" id="err" role="alert"></div>
</main>

<script type="text/js-worker" id="worker-src">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2/+esm";
env.allowLocalModels = false;
let asr = null, busy = false;
const IDS = {
  tiny: "onnx-community/whisper-tiny",
  base: "onnx-community/whisper-base",
  small: "onnx-community/whisper-small",
  turbo: "onnx-community/whisper-large-v3-turbo",
};
// If a model fails to load (memory, missing GPU feature), try the next smaller one.
const CHAIN = { turbo: ["turbo", "small", "base"], small: ["small", "base"], base: ["base"], tiny: ["tiny"] };

function gpuDtype(key, f16) {
  if (key === "turbo") return { encoder_model: "q4", decoder_model_merged: "q4" };          // ~760 MB
  if (key === "small") return { encoder_model: f16 ? "fp16" : "fp32", decoder_model_merged: "q4" }; // ~410 / 590 MB
  return { encoder_model: "fp32", decoder_model_merged: "q4" };
}

async function pickDevice() {
  try {
    if (self.navigator && navigator.gpu) {
      const a = await navigator.gpu.requestAdapter();
      if (a) return { device: "webgpu", f16: a.features.has("shader-f16") };
    }
  } catch (e) {}
  return { device: "wasm", f16: false };
}

self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "load") {
    const { device, f16 } = await pickDevice();
    let chain = CHAIN[m.model] || ["base"];
    if (device === "wasm") chain = chain.filter((k) => k !== "turbo"); // too heavy without GPU
    let lastErr = "";
    for (let i = 0; i < chain.length; i++) {
      const key = chain[i];
      try {
        asr = null;
        const dtype = device === "webgpu" ? gpuDtype(key, f16) : "q8";
        const files = {};
        self.postMessage({ type: "progress", pct: 0, note: key });
        asr = await pipeline("automatic-speech-recognition", IDS[key], {
          device, dtype,
          progress_callback: (p) => {
            if (p.status === "progress" && p.file) {
              files[p.file] = { loaded: p.loaded, total: p.total };
              let l = 0, t = 0;
              for (const k in files) { l += files[k].loaded; t += files[k].total; }
              self.postMessage({ type: "progress", pct: t ? l / t : 0, note: key });
            }
          },
        });
        // warm-up so the first real chunk is fast
        await asr(new Float32Array(16000), { language: "english", task: "transcribe" });
        self.postMessage({ type: "ready", device, model: key, requested: m.model });
        return;
      } catch (err) {
        lastErr = key + ": " + String(err && err.message || err);
        self.postMessage({ type: "fallback", failed: key, message: lastErr });
      }
    }
    asr = null;
    self.postMessage({ type: "error", message: lastErr || "Modell konnte nicht geladen werden" });
  } else if (m.type === "transcribe") {
    if (!asr || busy) { self.postMessage({ type: "skipped", id: m.id }); return; }
    busy = true;
    try {
      const opts = { task: "transcribe", return_timestamps: false };
      if (m.language) opts.language = m.language;
      const t0 = performance.now();
      const r = await asr(m.audio, opts);
      self.postMessage({ type: "result", id: m.id, text: (r.text || "").trim(), ms: performance.now() - t0 });
    } catch (err) {
      self.postMessage({ type: "error", message: String(err && err.message || err) });
    } finally { busy = false; }
  }
};
</script>

<script type="text/js-worklet" id="worklet-src">
class Cap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor("cap", Cap);
</script>

<script>
const $ = (id) => document.getElementById(id);
const SR = 16000, MAX_WINDOW = 20 * SR, TICK_MS = 700, SILENCE_RMS = 0.012;

let worker, ready = false, listening = false;
let ctx, stream, node, wake;
let chunks = [], total = 0;            // raw captured audio
let committedAt = 0;                   // sample index where committed text ends
let doneText = "", liveText = "";
let reqId = 0, inflight = false, timer = null, lastSentTotal = 0;

function status(s) { $("status").textContent = s; }
function err(s) { $("err").textContent = s || ""; }

function render() {
  const out = $("out");
  if (!doneText && !liveText) { out.innerHTML = '<span class="ph">Der Text erscheint hier, während du sprichst.</span>'; return; }
  out.innerHTML = "";
  const a = document.createElement("span"); a.className = "done"; a.textContent = doneText;
  const b = document.createElement("span"); b.className = "live"; b.textContent = (doneText && liveText ? " " : "") + liveText;
  out.append(a, b);
}

function makeWorker() {
  const src = $("worker-src").textContent;
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })), { type: "module" });
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "progress") { $("bar").hidden = false; $("barfill").style.width = Math.round(m.pct * 100) + "%"; status("Lade " + (m.note || "Modell") + "… " + Math.round(m.pct * 100) + " %"); }
    else if (m.type === "fallback") { err("Konnte nicht geladen werden, weiche auf kleineres Modell aus. (" + m.message.slice(0, 160) + ")"); }
    else if (m.type === "ready") {
      ready = true; $("bar").hidden = true; $("go").disabled = false; $("go").textContent = "Aufnahme starten";
      status("Bereit · " + m.model + " · " + (m.device === "webgpu" ? "GPU" : "CPU") + (m.requested !== m.model ? " (Ausweichmodell)" : ""));
    } else if (m.type === "result") onResult(m);
    else if (m.type === "skipped") inflight = false;
    else if (m.type === "error") { inflight = false; err("Fehler: " + m.message); status("Fehler"); $("go").disabled = false; if (!ready) $("go").textContent = "Erneut laden"; }
  };
  worker.onerror = (e) => { err("Worker-Fehler: " + (e.message || "unbekannt")); };
}

function loadModel() {
  err(""); ready = false;
  $("go").disabled = true; $("go").textContent = "Lädt…";
  status("Starte…");
  if (worker) worker.terminate();
  makeWorker();
  worker.postMessage({ type: "load", model: $("model").value });
}

function concat(from, to) {
  const out = new Float32Array(to - from);
  let pos = 0, off = 0;
  for (const c of chunks) {
    const end = off + c.length;
    if (end > from && off < to) {
      const s = Math.max(from - off, 0), e = Math.min(to - off, c.length);
      out.set(c.subarray(s, e), pos); pos += e - s;
    }
    off = end;
    if (off >= to) break;
  }
  return out;
}
function rms(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / (a.length || 1)); }

function tick() {
  if (!listening || inflight) return;
  const newSamples = total - lastSentTotal;
  if (newSamples < SR * 0.8) return;
  let from = committedAt;
  if (total - from > MAX_WINDOW) from = total - MAX_WINDOW;
  const audio = concat(from, total);
  if (rms(audio) < SILENCE_RMS * 0.6) { lastSentTotal = total; return; }
  inflight = true; lastSentTotal = total;
  const id = ++reqId;
  worker.postMessage({ type: "transcribe", id, audio, language: $("lang").value || null }, [audio.buffer]);
  tick.pending = { id, end: total, from };
}

/* ---- glossary correction (GLOSSARY-START) ---- */
let glossary = [];
function sKey(s) {
  return s.toLowerCase().replace(/ph/g, "f").replace(/th/g, "t").replace(/[ck]/g, "k").replace(/y/g, "i")
    .replace(/[^a-z0-9äöüß]/g, "").replace(/(.)\1+/g, "$1");
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function parseTerms(str) {
  return str.split(/[,;\n]/).map((s) => s.trim()).filter((s) => s.length >= 2)
    .map((term) => ({ term, key: sKey(term) })).filter((g) => g.key.length >= 2);
}
function tolerance(len) { return len <= 4 ? 0 : len <= 8 ? 1 : 2; }
function findTerm(k) {
  for (const g of glossary) {
    const d = lev(k, g.key);
    if (d === 0 || (d <= tolerance(g.key.length) && k[0] === g.key[0])) return g.term;
  }
  return null;
}
function applyGlossary(text) {
  if (!glossary.length || !text) return text;
  const w = text.split(/\s+/).filter(Boolean).map((tok) => {
    const m = tok.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
    return { pre: m[1], core: m[2], post: m[3] };
  });
  const out = [];
  for (let i = 0; i < w.length;) {
    let hit = null, used = 1;
    for (let n = Math.min(5, w.length - i); n >= 1 && !hit; n--) {
      let ok = true;
      for (let j = 0; j < n - 1; j++) if (w[i + j].post) ok = false;   // no punctuation inside a phrase
      if (!ok) continue;
      const k = sKey(w.slice(i, i + n).map((x) => x.core).join(""));
      if (k.length < 2) continue;
      let t = findTerm(k), plural = false;
      if (!t && k.length > 3 && k.endsWith("s")) { t = findTerm(k.slice(0, -1)); plural = !!t; }
      if (t) { hit = (plural && !/s$/i.test(t) ? t + "s" : t); used = n; }
    }
    if (hit) { out.push(w[i].pre + hit + w[i + used - 1].post); i += used; }
    else { out.push(w[i].pre + w[i].core + w[i].post); i++; }
  }
  return out.join(" ");
}
/* ---- glossary correction (GLOSSARY-END) ---- */

function clean(t) {
  return t.replace(/\[(BLANK_AUDIO|MUSIC|Music)\]|\(.*?(Musik|music).*?\)/g, "").trim();
}

function onResult(m) {
  inflight = false;
  if (!tick.pending || tick.pending.id !== m.id) return;
  const { end } = tick.pending;
  const text = applyGlossary(clean(m.text));
  liveText = text;
  // Commit when the window is long, or when the last ~0.8 s are quiet after a decent stretch of speech.
  const windowLen = end - committedAt;
  const tail = concat(Math.max(end - Math.floor(SR * 0.8), 0), end);
  const quiet = rms(tail) < SILENCE_RMS;
  if (text && (windowLen > 14 * SR || (windowLen > 4 * SR && quiet))) {
    doneText = (doneText + " " + text).trim();
    liveText = "";
    committedAt = end;
    // free old audio
    trim();
  }
  status("Höre zu… " + (m.ms / 1000).toFixed(1) + " s pro Schritt");
  render();
}

function trim() {
  let off = 0; const keep = [];
  for (const c of chunks) { if (off + c.length > committedAt) keep.push(c); else { /* drop */ } off += c.length; }
  // keep indices consistent: rebuild with a leading offset
  const dropped = chunks.length - keep.length;
  if (dropped > 0) {
    let droppedSamples = 0;
    for (let i = 0; i < dropped; i++) droppedSamples += chunks[i].length;
    chunks = keep; total -= droppedSamples; committedAt -= droppedSamples; lastSentTotal -= droppedSamples;
    if (tick.pending) { tick.pending.end -= droppedSamples; tick.pending.from -= droppedSamples; }
  }
}

async function start() {
  err("");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    err("Mikrofon nicht verfügbar. Die Seite muss über HTTPS geöffnet werden."); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { err("Mikrofonzugriff verweigert."); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
  const url = URL.createObjectURL(new Blob([$("worklet-src").textContent], { type: "text/javascript" }));
  await ctx.audioWorklet.addModule(url);
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "cap");
  node.port.onmessage = (e) => {
    const c = e.data; chunks.push(c); total += c.length;
    $("lvl").style.width = Math.min(100, rms(c) * 700) + "%";
  };
  src.connect(node);
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  listening = true;
  timer = setInterval(tick, TICK_MS);
  $("go").textContent = "Stopp"; $("go").classList.add("live");
  $("model").disabled = true; $("lang").disabled = true;
  status("Höre zu…");
}

async function stop() {
  listening = false; clearInterval(timer);
  // final pass on whatever is left
  const rest = concat(committedAt, total);
  if (liveText) { doneText = (doneText + " " + liveText).trim(); liveText = ""; }
  render();
  try { node.disconnect(); stream.getTracks().forEach((t) => t.stop()); await ctx.close(); } catch (e) {}
  try { wake && wake.release(); } catch (e) {}
  chunks = []; total = 0; committedAt = 0; lastSentTotal = 0; inflight = false;
  $("lvl").style.width = "0";
  $("go").textContent = "Aufnahme starten"; $("go").classList.remove("live");
  $("model").disabled = false; $("lang").disabled = false;
  status("Gestoppt");
}

$("go").onclick = () => { if (!ready) loadModel(); else listening ? stop() : start(); };
$("model").onchange = () => { ready = false; $("go").disabled = false; $("go").textContent = "Modell laden"; status("Bereit"); };
$("clear").onclick = () => { doneText = ""; liveText = ""; committedAt = total; render(); };
$("copy").onclick = async () => {
  const t = (doneText + " " + liveText).trim(); if (!t) return;
  try { await navigator.clipboard.writeText(t); status("Kopiert"); } catch (e) { err("Kopieren nicht möglich."); }
};
try { $("terms").value = localStorage.getItem("wl-terms") || ""; } catch (e) {}
glossary = parseTerms($("terms").value);
$("terms").oninput = () => {
  glossary = parseTerms($("terms").value);
  try { localStorage.setItem("wl-terms", $("terms").value); } catch (e) {}
};
$("go").disabled = false;
render();
</script>
</body>
</html>
